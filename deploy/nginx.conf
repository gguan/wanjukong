# wanjukong — dual domain setup
# overrealm.shop  → web 前台（国际用户）
# wanjukong.com   → API + Admin + 小程序
#
# 放到服务器 /etc/nginx/sites-available/wanjukong
# ln -s /etc/nginx/sites-available/wanjukong /etc/nginx/sites-enabled/

# ─── HTTP → HTTPS 重定向 ─────────────────────────────────────

server {
    listen 80;
    server_name
        overrealm.shop www.overrealm.shop
        wanjukong.com www.wanjukong.com
        api.wanjukong.com admin.wanjukong.com;
    return 301 https://$host$request_uri;
}

# ─── Web 前台 (overrealm.shop) ── 国际用户 ──────────────────

server {
    listen 443 ssl http2;
    server_name overrealm.shop www.overrealm.shop;

    ssl_certificate     /etc/letsencrypt/live/overrealm.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overrealm.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20M;

    # API 代理（同域，无跨域问题）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nuxt SSR
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── API (api.wanjukong.com) ── 小程序 + 公共 API ───────────
# 仅暴露 public + miniprogram 路由，屏蔽 admin 路由

server {
    listen 443 ssl http2;
    server_name api.wanjukong.com;

    ssl_certificate     /etc/letsencrypt/live/wanjukong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wanjukong.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # 屏蔽 admin 接口 — 不对公网暴露
    location /api/admin/ {
        return 403;
    }

    # 允许 public + miniprogram 接口
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Admin 后台 (admin.wanjukong.com) ────────────────────────
# API 走同域代理（/api/*），消除跨域问题

server {
    listen 443 ssl http2;
    server_name admin.wanjukong.com;

    ssl_certificate     /etc/letsencrypt/live/wanjukong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wanjukong.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # API 同域代理 — admin 请求 /api/* 走 Nginx 代理，无跨域
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nuxt SSR (Admin)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── wanjukong.com 主域名 → 重定向到 overrealm.shop ─────────

server {
    listen 443 ssl http2;
    server_name wanjukong.com www.wanjukong.com;

    ssl_certificate     /etc/letsencrypt/live/wanjukong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wanjukong.com/privkey.pem;

    return 301 https://overrealm.shop$request_uri;
}
