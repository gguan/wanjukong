# wanjukong — dual domain setup
# overrealm.shop  → web 前台（国际用户）
# wanjukong.com   → API + Admin + 小程序
#
# 放到服务器 /etc/nginx/sites-available/wanjukong
# ln -s /etc/nginx/sites-available/wanjukong /etc/nginx/sites-enabled/

# ─── HTTP → HTTPS 重定向 ─────────────────────────────────────

server {
    listen 80;
    server_name
        overrealm.shop www.overrealm.shop
        wanjukong.com www.wanjukong.com
        api.wanjukong.com admin.wanjukong.com;
    return 301 https://$host$request_uri;
}

# ─── Web 前台 (overrealm.shop) ── 国际用户 ──────────────────

server {
    listen 443 ssl http2;
    server_name overrealm.shop www.overrealm.shop;

    ssl_certificate     /etc/letsencrypt/live/overrealm.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overrealm.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20M;

    # ─── 安全响应头 ─────────────────────────────────────
    # Google Safe Browsing, Mozilla Observatory 都以这几个头为基准打分。
    # 缺少任何一个都会把 .shop 新域往"可疑"方向推。
    #
    # HSTS: 1 年 + includeSubDomains + preload。部署后至少跑 1 周再提交到
    #   https://hstspreload.org/ 以防意外需要回退。
    # X-Content-Type-Options: 禁止 MIME sniffing（防脚本被当作图片绕过）。
    # X-Frame-Options: 阻止点击劫持（clickjacking）。
    # Referrer-Policy: 跨站点击只传 origin，不泄漏完整 URL。
    # Permissions-Policy: 明确关闭本站不用的 API（相机/麦克风等），降低风险面。
    # Content-Security-Policy: 白名单 PayPal JS SDK 所需的域；其余默认 self。
    #   允许 'unsafe-inline' 是因为 Nuxt runtime + 我们的 JSON-LD inline <script>
    #   需要；改用 nonce 是后续优化方向。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.paypal.com https://www.paypalobjects.com https://*.paypal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api-m.paypal.com https://*.paypal.com; frame-src https://*.paypal.com; object-src 'none'; base-uri 'self'; form-action 'self' https://*.paypal.com; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # API 代理（同域，无跨域问题）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nuxt SSR
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── API (api.wanjukong.com) ── 小程序 + 公共 API ───────────
# 仅暴露 public + miniprogram 路由，屏蔽 admin 路由

server {
    listen 443 ssl http2;
    server_name api.wanjukong.com;

    ssl_certificate     /etc/letsencrypt/live/wanjukong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wanjukong.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # 安全响应头 — API 不直接渲染 HTML，但浏览器开发者工具访问时仍需 HSTS/nosniff。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 屏蔽 admin 接口 — 不对公网暴露
    location /api/admin/ {
        return 403;
    }

    # 允许 public + miniprogram 接口
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Admin 后台 (admin.wanjukong.com) ────────────────────────
# API 走同域代理（/api/*），消除跨域问题

server {
    listen 443 ssl http2;
    server_name admin.wanjukong.com;

    ssl_certificate     /etc/letsencrypt/live/wanjukong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wanjukong.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # 安全响应头 — admin 面板不应被任何外域 iframe 嵌入，X-Frame-Options DENY。
    # CSP 略宽松是因为 Element Plus 会注入大量 inline style，收紧后需额外测试。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # API 同域代理 — admin 请求 /api/* 走 Nginx 代理，无跨域
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nuxt SSR (Admin)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── wanjukong.com 主域名 → 重定向到 overrealm.shop ─────────

server {
    listen 443 ssl http2;
    server_name wanjukong.com www.wanjukong.com;

    ssl_certificate     /etc/letsencrypt/live/wanjukong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wanjukong.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://overrealm.shop$request_uri;
}
