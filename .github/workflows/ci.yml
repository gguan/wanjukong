name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wanjukong_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wanjukong_test

    steps:
      # Third-party actions pinned to commit SHA to prevent supply-chain
      # attacks via tag retargeting. Update via Dependabot or by re-resolving
      # the SHA for a new tag manually.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.3

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wanjukong/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Type check API
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Type check Web
        working-directory: apps/web
        run: npx nuxi typecheck

      - name: Type check Admin
        working-directory: apps/admin
        run: npx nuxi typecheck

      - name: Run API tests
        run: pnpm --filter @wanjukong/api test

      - name: Build API
        run: pnpm --filter @wanjukong/api build

      - name: Build Web
        run: pnpm --filter @wanjukong/web build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:3001
          NUXT_PUBLIC_PAYPAL_CLIENT_ID: dummy

      - name: Build Admin
        run: pnpm --filter @wanjukong/admin build
        env:
          NUXT_PUBLIC_API_BASE_URL: http://localhost:3001
