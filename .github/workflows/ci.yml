name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wanjukong_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wanjukong_test

    steps:
      # Third-party actions pinned to commit SHA to prevent supply-chain
      # attacks via tag retargeting. Update via Dependabot or by re-resolving
      # the SHA for a new tag manually.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wanjukong/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Type check API
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Type check Web
        working-directory: apps/web
        run: npx nuxi typecheck

      - name: Type check Admin
        working-directory: apps/admin
        run: npx nuxi typecheck

      - name: Run API tests
        run: pnpm --filter @wanjukong/api test

      - name: Build API
        run: pnpm --filter @wanjukong/api build

      - name: Build Web
        run: pnpm --filter @wanjukong/web build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:3001
          NUXT_PUBLIC_PAYPAL_CLIENT_ID: dummy

      - name: Build Admin
        run: pnpm --filter @wanjukong/admin build
        env:
          NUXT_PUBLIC_API_BASE_URL: http://localhost:3001
